<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap');
      :root {
        --space-bg: #0b0e1a;
        --kurz-teal: #4ecdc4;
        --kurz-coral: #ff6b6b;
        --kurz-purple: #a06cd5;
        --octo-purple: #7b2cb8;
        --octo-blue: #1e3a8a;
        --text-bright: #ffffff;
        --font-main: 'Fredoka', 'Outfit', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--space-bg); font-family: var(--font-main); color: var(--text-bright); }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .flat-stroke { stroke: #080a14; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .octo-body { fill: var(--octo-purple); }
      .octo-blue-blood { fill: #1e3a8a; }
      .octo-heart { fill: var(--kurz-coral); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene1" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div class="badge clip" data-start="0" data-duration="8" style="display:flex; align-items:center; gap:16px; padding:14px 36px; border-radius:100px; background:rgba(78,205,196,0.18); border:3px solid var(--kurz-teal); color:var(--kurz-teal); font-size:36px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:30px;">
        <span style="width:18px;height:18px;border-radius:50%;background:var(--kurz-teal);box-shadow:0 0 14px var(--kurz-teal);"></span>
        Did You Know?
      </div>

      <h1 class="headline clip" data-start="0" data-duration="8" style="font-size:96px; font-weight:700; line-height:1.05; letter-spacing:-0.02em; text-align:center; max-width:1500px; margin-bottom:40px;">
        The Octopus Has <span style="color:#ff6b6b;">3 Hearts</span> <span style="color:#4ecdc4;">And Blue Blood</span>
      </h1>

      <div class="octo-clip clip" data-start="0" data-duration="8" style="position:absolute; bottom:60px; right:100px;">
        <svg width="340" height="340" viewBox="0 0 340 340">
          <ellipse cx="170" cy="170" rx="120" ry="90" class="octo-body flat-stroke" />
          <circle cx="120" cy="140" r="14" fill="#080a14" />
          <circle cx="220" cy="140" r="14" fill="#080a14" />
          <circle cx="120" cy="140" r="6" fill="#ffffff" />
          <circle cx="220" cy="140" r="6" fill="#ffffff" />
          <path d="M140,190 Q170,220 200,190" stroke="#080a14" stroke-width="8" fill="none" stroke-linecap="round" />
          <path d="M60,180 Q30,220 50,260 Q70,250 80,210 Z" class="octo-body flat-stroke" />
          <path d="M280,180 Q310,220 290,260 Q270,250 260,210 Z" class="octo-body flat-stroke" />
          <path d="M100,200 Q80,260 110,280 Q130,260 120,210 Z" class="octo-body flat-stroke" />
          <path d="M240,200 Q260,260 230,280 Q210,260 220,210 Z" class="octo-body flat-stroke" />
        </svg>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".badge", { opacity: 0, y: -20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 0);
      tl.fromTo(".headline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.3);
      tl.fromTo(".octo-clip", { opacity: 0, x: 150, scale: 0.8 }, { opacity: 1, x: 0, scale: 1, duration: 1.0, ease: "power3.out" }, 0.5);
      tl.to(".octo-clip", { y: -12, duration: 3, repeat: 2, yoyo: true, ease: "sine.inOut" }, 0);
      window.__timelines["scene1"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

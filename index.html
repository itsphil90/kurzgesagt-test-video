<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap');

      :root {
        --space-bg: #0b0e1a;
        --star-yellow: #ffe66d;
        --kurz-teal: #4ecdc4;
        --kurz-coral: #ff6b6b;
        --kurz-purple: #a06cd5;
        --duck-yellow: #ffd166;
        --duck-beak: #f77f00;
        --duck-belly: #ffe3a833;
        --sun-yellow: #ffb703;
        --sun-glow: #fb8500;
        --text-bright: #ffffff;
        --font-main: 'Fredoka', 'Outfit', sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--space-bg);
        font-family: var(--font-main);
        color: var(--text-bright);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 50%, #1a1e36 0%, #080a14 100%);
      }

      /* Space Stars Background */
      .star {
        position: absolute;
        border-radius: 50%;
        background: #ffffff;
        opacity: 0.6;
      }

      .star-cross {
        position: absolute;
        fill: #ffe66d;
        opacity: 0.8;
      }

      /* Grid Container */
      .stage {
        position: relative;
        width: 1700px;
        height: 900px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 40px;
        z-index: 2;
      }

      /* Left Side: Typography & Fact Card */
      .left-col {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .category-pill {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 28px;
        border-radius: 100px;
        background: rgba(78, 205, 196, 0.18);
        border: 3px solid var(--kurz-teal);
        color: var(--kurz-teal);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 28px;
        box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
      }

      .pill-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--kurz-teal);
        box-shadow: 0 0 12px var(--kurz-teal);
      }

      .headline {
        font-size: 82px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 28px;
        color: var(--text-bright);
      }

      .headline .hl-teal {
        color: var(--kurz-teal);
      }

      .headline .hl-coral {
        color: var(--kurz-coral);
      }

      .fact-card {
        padding: 28px 36px;
        background: rgba(255, 255, 255, 0.06);
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        backdrop-filter: blur(12px);
        max-width: 720px;
      }

      .fact-text {
        font-size: 32px;
        line-height: 1.35;
        color: #e0e6ed;
        font-weight: 600;
      }

      /* Right Side: Kurzgesagt Duck Astronaut Character */
      .right-col {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .illustration-box {
        position: relative;
        width: 750px;
        height: 750px;
      }

      svg.kurz-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Flat 2D Vector Stroke & Fills */
      .flat-stroke {
        stroke: #080a14;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .duck-body { fill: var(--duck-yellow); }
      .duck-beak { fill: var(--duck-beak); }
      .space-suit { fill: #f8f9fa; }
      .helmet-glass {
        fill: rgba(78, 205, 196, 0.35);
        stroke: var(--kurz-teal);
        stroke-width: 6;
      }

      .sun-core { fill: var(--sun-yellow); }
      .sun-glow { fill: var(--sun-glow); opacity: 0.4; }
      .lightning-bolt { fill: #ffe66d; stroke: #ffb703; stroke-width: 4; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <!-- Audio Elements -->
      <audio id="voice" src="assets/voiceover.wav" data-start="0.5" data-duration="4.7" data-has-audio="true" data-track-index="0"></audio>
      <audio id="sfx-pop" src="assets/sfx/pop.mp3" data-start="0.2" data-duration="0.72" data-has-audio="true" data-track-index="1"></audio>
      <audio id="sfx-chime" src="assets/sfx/chime.mp3" data-start="1.5" data-duration="2.0" data-has-audio="true" data-track-index="2"></audio>
      <audio id="sfx-whoosh" src="assets/sfx/whoosh.mp3" data-start="3.2" data-duration="0.57" data-has-audio="true" data-track-index="3"></audio>

      <!-- Background Stars -->
      <div class="star clip" data-start="0" data-duration="10" style="top:15%; left:10%; width:8px; height:8px;" id="s1"></div>
      <div class="star clip" data-start="0" data-duration="10" style="top:25%; left:85%; width:10px; height:10px;" id="s2"></div>
      <div class="star clip" data-start="0" data-duration="10" style="top:75%; left:15%; width:6px; height:6px;" id="s3"></div>
      <div class="star clip" data-start="0" data-duration="10" style="top:80%; left:80%; width:12px; height:12px;" id="s4"></div>

      <!-- Main Stage Container -->
      <div class="stage">
        <!-- Left Column: Kurzgesagt Style Text -->
        <div class="left-col">
          <div class="category-pill clip" data-start="0" data-duration="10" id="pill">
            <span class="pill-dot"></span>
            Kurzgesagt Fact
          </div>

          <h1 class="headline clip" data-start="0" data-duration="10" id="headline">
            Hotter Than <br /><span class="hl-teal">The Sun</span>
          </h1>

          <div class="fact-card clip" data-start="0" data-duration="10" id="fact-card">
            <p class="fact-text" id="fact-text">
              A single <span style="color:#ffe66d;">lightning bolt</span> reaches <span style="color:#ff6b6b; font-weight:700;">50,000°F</span>—5 times hotter than the sun's surface!
            </p>
          </div>
        </div>

        <!-- Right Column: Kurzgesagt Duck Astronaut Illustration -->
        <div class="right-col clip" data-start="0" data-duration="10" id="duck-col">
          <div class="illustration-box">
            <svg class="kurz-svg" viewBox="0 0 700 700">
              <defs>
                <filter id="sun-blur" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="15" />
                </filter>
              </defs>

              <!-- Glowing Sun in Background -->
              <g id="sun-group" transform="translate(480, 220)">
                <circle cx="0" cy="0" r="140" class="sun-glow" filter="url(#sun-blur)" />
                <circle cx="0" cy="0" r="110" class="sun-core flat-stroke" />
                <!-- Sun Rays / Corona -->
                <g id="sun-rays">
                  <line x1="0" y1="-140" x2="0" y2="-160" stroke="#ffb703" stroke-width="8" stroke-linecap="round" />
                  <line x1="140" y1="0" x2="160" y2="0" stroke="#ffb703" stroke-width="8" stroke-linecap="round" />
                  <line x1="0" y1="140" x2="0" y2="160" stroke="#ffb703" stroke-width="8" stroke-linecap="round" />
                  <line x1="-140" y1="0" x2="-160" y2="0" stroke="#ffb703" stroke-width="8" stroke-linecap="round" />
                </g>
              </g>

              <!-- Space Duck Character -->
              <g id="duck-character" transform="translate(250, 380)">
                <!-- Space Suit Body -->
                <path d="M-90,120 Q-100,20 -40,-20 L40,-20 Q100,20 90,120 Z" class="space-suit flat-stroke" />

                <!-- Suit Patch / Emblem -->
                <circle cx="-30" cy="40" r="18" fill="#a06cd5" class="flat-stroke" />
                <polygon points="-30,28 -22,46 -38,46" fill="#ffe66d" />

                <!-- Duck Head & Beak -->
                <circle cx="0" cy="-60" r="85" class="duck-body flat-stroke" />

                <!-- Eye -->
                <circle cx="25" cy="-80" r="12" fill="#080a14" />
                <circle cx="28" cy="-84" r="4" fill="#ffffff" />

                <!-- Beak -->
                <path d="M20,-60 C70,-60 85,-40 75,-25 C65,-10 20,-30 20,-60 Z" class="duck-beak flat-stroke" />

                <!-- Glass Helmet Bubble -->
                <circle cx="10" cy="-60" r="115" class="helmet-glass" />
                <!-- Helmet Glare -->
                <path d="M-60,-120 A105,105 0 0,1 40,-155 A115,115 0 0,0 -80,-80 Z" fill="rgba(255,255,255,0.4)" />

                <!-- Space Suit Arms / Floating Wings -->
                <g id="left-wing">
                  <path d="M-85,10 Q-140,20 -130,80 Q-90,90 -75,40 Z" class="space-suit flat-stroke" />
                </g>
                <g id="right-wing">
                  <path d="M85,10 Q140,20 130,80 Q90,90 75,40 Z" class="space-suit flat-stroke" />
                </g>
              </g>

              <!-- Lightning Bolt Graphic -->
              <g id="lightning-group" transform="translate(260, 80)">
                <polygon points="0,-60 -50,40 10,40 -30,160 60,30 0,30" class="lightning-bolt flat-stroke" />
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // 1. Frame 0 Presentable State
      tl.fromTo("#pill",
        { opacity: 0.2, y: -10, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" },
        0
      );

      tl.fromTo("#headline",
        { opacity: 0.3, y: 20 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0
      );

      tl.fromTo("#duck-col",
        { opacity: 0.3, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // 2. Kurzgesagt Floating Animation for Space Duck (Idle motion)
      tl.to("#duck-character", {
        y: "-=25",
        rotation: 3,
        duration: 2.5,
        repeat: 3,
        yoyo: true,
        ease: "sine.inOut"
      }, 0);

      // Wing Floating Gesture
      tl.to("#left-wing", {
        rotation: -12,
        transformOrigin: "top right",
        duration: 1.8,
        repeat: 4,
        yoyo: true,
        ease: "sine.inOut"
      }, 0);

      tl.to("#right-wing", {
        rotation: 12,
        transformOrigin: "top left",
        duration: 2.0,
        repeat: 4,
        yoyo: true,
        ease: "sine.inOut"
      }, 0);

      // 3. Lightning Bolt Strike Entry & Pulse
      tl.fromTo("#lightning-group",
        { opacity: 0, scale: 0.2, y: -80 },
        { opacity: 1, scale: 1.1, y: 0, duration: 0.5, ease: "bounce.out" },
        1.2
      );

      tl.to("#lightning-group", {
        scale: 1.0,
        duration: 0.2,
        ease: "power1.out"
      }, 1.7);

      // 4. Fact Card Entrance
      tl.fromTo("#fact-card",
        { opacity: 0, y: 30, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        1.5
      );

      // Sun Corona Spin
      tl.to("#sun-rays", {
        rotation: 360,
        transformOrigin: "50% 50%",
        duration: 10,
        ease: "none"
      }, 0);

      // Subtle Background Stars Twinkle
      tl.to(["#s1", "#s3"], { opacity: 0.2, duration: 1.5, repeat: 5, yoyo: true, ease: "sine.inOut" }, 0);
      tl.to(["#s2", "#s4"], { opacity: 0.9, duration: 2.0, repeat: 4, yoyo: true, ease: "sine.inOut" }, 0.5);

      // 5. Smooth Outro Transition
      tl.to(["#pill", "#headline", "#fact-card", "#duck-col"], {
        opacity: 0,
        y: -30,
        duration: 0.8,
        stagger: 0.1,
        ease: "power2.in"
      }, 9.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

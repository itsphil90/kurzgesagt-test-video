<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap');
      :root {
        --space-bg: #0b0e1a;
        --kurz-teal: #4ecdc4;
        --kurz-coral: #ff6b6b;
        --text-bright: #ffffff;
        --font-main: 'Fredoka', 'Outfit', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--space-bg); font-family: var(--font-main); color: var(--text-bright); }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .flat-stroke { stroke: #080a14; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .octo-skin { fill: #7b2cb8; transition: fill 0.4s ease; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene4" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <h2 class="title clip" data-start="0" data-duration="8" style="font-size:60px; font-weight:700; margin-bottom:80px;">
        Camouflage experts: Change in <span style="color:#ff6b6b;">under a second.</span>
      </h2>

      <div style="display:flex; gap:100px; align-items:center;">
        <!-- Octopus -->
        <svg width="400" height="400" viewBox="0 0 400 400" id="octo-svg">
          <path id="skin" d="M100,200 Q200,50 300,200 Q300,350 200,350 Q100,350 100,200 Z" class="octo-skin flat-stroke" />
          <circle cx="160" cy="180" r="14" fill="#080a14" />
          <circle cx="240" cy="180" r="14" fill="#080a14" />
          <path d="M50,220 Q0,300 120,280" stroke="#080a14" stroke-width="8" fill="none" class="arm" />
          <path d="M350,220 Q400,300 280,280" stroke="#080a14" stroke-width="8" fill="none" class="arm" />
        </svg>

        <div style="display:flex; flex-direction:column; gap:30px;">
          <div class="color-swatch clip" data-start="1.5" data-duration="6.5" style="display:flex; align-items:center; gap:20px;">
             <div style="width:50px; height:50px; border-radius:12px; background:#4ecdc4; border:3px solid #fff;"></div>
             <span style="font-size:28px;">Coral Reef</span>
          </div>
          <div class="color-swatch clip" data-start="3.5" data-duration="4.5" style="display:flex; align-items:center; gap:20px;">
             <div style="width:50px; height:50px; border-radius:12px; background:#b86e00; border:3px solid #fff;"></div>
             <span style="font-size:28px;">Sandy Floor</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#octo-svg", { scale: 0, rotate: -20 }, { scale: 1, rotate: 0, duration: 1.0, ease: "power3.out" }, 0.4);
      tl.to("#skin", { fill: "#4ecdc4", duration: 0.3 }, 1.5);
      tl.to("#skin", { fill: "#b86e00", duration: 0.3 }, 3.5);
      tl.to("#skin", { fill: "#7b2cb8", duration: 0.3 }, 5.5);
      window.__timelines["scene4"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

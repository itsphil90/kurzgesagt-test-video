<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap');
      :root {
        --space-bg: #0b0e1a;
        --kurz-coral: #ff6b6b;
        --kurz-teal: #4ecdc4;
        --text-bright: #ffffff;
        --font-main: 'Fredoka', 'Outfit', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--space-bg); font-family: var(--font-main); color: var(--text-bright); }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .flat-stroke { stroke: #080a14; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .heart { fill: var(--kurz-coral); stroke: #080a14; stroke-width: 4; }
      .blue-blood { fill: #1e3a8a; stroke: #080a14; stroke-width: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene2" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <h2 class="title clip" data-start="0" data-duration="8" style="font-size:64px; font-weight:700; margin-bottom:80px; text-align:center;">
        Two hearts for the gills, one for the body.
      </h2>

      <div style="display:flex; gap:100px; align-items:center;">
        <!-- Hearts Group -->
        <div style="display:flex; gap:30px; align-items:center;">
          <svg width="120" height="120" viewBox="0 0 100 100" class="heart-svg h1 clip" data-start="0" data-duration="8">
            <path d="M50,30 C35,10 10,25 10,50 C10,75 50,95 50,95 C50,95 90,75 90,50 C90,25 65,10 50,30 Z" class="heart flat-stroke" />
          </svg>
          <svg width="120" height="120" viewBox="0 0 100 100" class="heart-svg h2 clip" data-start="0" data-duration="8">
            <path d="M50,30 C35,10 10,25 10,50 C10,75 50,95 50,95 C50,95 90,75 90,50 C90,25 65,10 50,30 Z" class="heart flat-stroke" />
          </svg>
          <svg width="120" height="120" viewBox="0 0 100 100" class="heart-svg h3 clip" data-start="0" data-duration="8">
            <path d="M50,30 C35,10 10,25 10,50 C10,75 50,95 50,95 C50,95 90,75 90,50 C90,25 65,10 50,30 Z" class="heart flat-stroke" />
          </svg>
        </div>

        <div style="width:6px; height:180px; background:rgba(255,255,255,0.2); border-radius:3px;"></div>

        <!-- Blood Type Group -->
        <div style="display:flex; flex-direction:column; gap:40px;">
          <div style="display:flex; align-items:center; gap:24px;">
            <div style="width:60px; height:60px; border-radius:50%; background:#ff4d4d; border:3px solid #080a14;"></div>
            <span style="font-size:32px; font-weight:600; color:#ff4d4d;">Red (Iron)</span>
          </div>
          <div class="blue-line clip" data-start="1.5" data-duration="6.5" style="display:flex; align-items:center; gap:24px;">
            <div style="width:60px; height:60px; border-radius:50%; background:#1e3a8a; border:3px solid #080a14; box-shadow: 0 0 15px #1e3a8a;"></div>
            <span style="font-size:32px; font-weight:600; color:#4ecdc4;">Blue (Copper)</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(".heart-svg", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, stagger: 0.2, ease: "back.out(1.7)" }, 0.3);
      tl.to(".heart-svg", { scale: 1.1, duration: 0.4, repeat: 8, yoyo: true, ease: "sine.inOut" }, 0.8);
      tl.fromTo(".blue-line", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 1.5);
      window.__timelines["scene2"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

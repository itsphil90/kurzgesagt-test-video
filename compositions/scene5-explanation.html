<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap');
      :root {
        --space-bg: #0b0e1a;
        --kurz-teal: #4ecdc4;
        --octo-purple: #7b2cb8;
        --text-bright: #ffffff;
        --font-main: 'Fredoka', 'Outfit', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--space-bg); font-family: var(--font-main); color: var(--text-bright); }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 140px; }
      .flat-stroke { stroke: #080a14; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene5" data-start="0" data-duration="9.8" data-width="1920" data-height="1080">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:80px; width:100%; align-items:center;">
        <!-- Jar Escape -->
        <div style="display:flex; justify-content:center; position:relative;">
          <svg width="400" height="400" viewBox="0 0 400 400">
             <rect x="100" y="100" width="200" height="250" rx="20" fill="rgba(255,255,255,0.1)" stroke="#fff" stroke-width="4" />
             <rect x="90" y="70" width="220" height="30" rx="10" fill="#fff" id="lid" />
             <path d="M150,220 Q200,320 250,220" stroke="#7b2cb8" stroke-width="12" fill="none" id="octo-leg" />
          </svg>
        </div>

        <div>
          <h2 class="title clip" data-start="0" data-duration="9.8" style="font-size:64px; font-weight:700; line-height:1.2; margin-bottom:30px;">
            Some of the most <span style="color:#4ecdc4;">intelligent animals</span> on Earth.
          </h2>
          <p class="desc clip" data-start="0.5" data-duration="9.3" style="font-size:36px; color:#d0c2b2; line-height:1.4;">
            They use tools, solve puzzles, and can even escape sealed jars.
          </p>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo(".desc", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.to("#lid", { y: -60, rotate: 15, duration: 1.0, ease: "power2.out" }, 2.0);
      tl.to("#octo-leg", { y: -80, duration: 1.2, repeat: 3, yoyo: true, ease: "sine.inOut" }, 2.2);
      window.__timelines["scene5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

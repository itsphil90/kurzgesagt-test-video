<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap');

      :root {
        --space-bg: #0b0e1a;
        --kurz-teal: #4ecdc4;
        --kurz-coral: #ff6b6b;
        --kurz-purple: #a06cd5;
        --duck-yellow: #ffd166;
        --duck-beak: #f77f00;
        --sun-yellow: #ffb703;
        --sun-glow: #fb8500;
        --lightning: #ffe66d;
        --text-bright: #ffffff;
        --font-main: 'Fredoka', 'Outfit', sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--space-bg);
        font-family: var(--font-main);
        color: var(--text-bright);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .star {
        position: absolute;
        border-radius: 50%;
        background: #ffffff;
        opacity: 0.6;
      }

      .flat-stroke {
        stroke: #080a14;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="41.8"
      data-width="1920"
      data-height="1080"
    >
      <!-- Background Stars -->
      <div class="star clip" data-start="0" data-duration="41.8" style="top:10%; left:8%; width:8px; height:8px;"></div>
      <div class="star clip" data-start="0" data-duration="41.8" style="top:20%; left:85%; width:10px; height:10px;"></div>
      <div class="star clip" data-start="0" data-duration="41.8" style="top:75%; left:12%; width:6px; height:6px;"></div>
      <div class="star clip" data-start="0" data-duration="41.8" style="top:85%; left:78%; width:12px; height:12px;"></div>
      <div class="star clip" data-start="0" data-duration="41.8" style="top:40%; left:92%; width:7px; height:7px;"></div>
      <div class="star clip" data-start="0" data-duration="41.8" style="top:60%; left:5%; width:9px; height:9px;"></div>

      <!-- Voiceover -->
      <audio id="voice" src="assets/voice/voiceover.wav" data-start="0" data-duration="41.8" data-has-audio="true" data-track-index="0"></audio>

      <!-- Scene 1: Title Card (0-8s) -->
      <div data-composition-id="scene1" data-composition-src="compositions/scene1-title.html" data-start="0" data-duration="8" data-track-index="1"></div>

      <!-- Scene 2: 3 Hearts & Blue Blood (8-16s) -->
      <div data-composition-id="scene2" data-composition-src="compositions/scene2-lightning.html" data-start="8" data-duration="8" data-track-index="2"></div>

      <!-- Scene 3: Nine Brains (16-24s) -->
      <div data-composition-id="scene3" data-composition-src="compositions/scene3-temperature.html" data-start="16" data-duration="8" data-track-index="3"></div>

      <!-- Scene 4: Camouflage (24-32s) -->
      <div data-composition-id="scene4" data-composition-src="compositions/scene4-flash-thunder.html" data-start="24" data-duration="8" data-track-index="4"></div>

      <!-- Scene 5: Intelligence (32-41.8s) -->
      <div data-composition-id="scene5" data-composition-src="compositions/scene5-explanation.html" data-start="32" data-duration="9.8" data-track-index="5"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    </div>
  </body>
</html>

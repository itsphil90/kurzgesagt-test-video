<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap');
      :root {
        --space-bg: #0b0e1a;
        --kurz-teal: #4ecdc4;
        --duck-yellow: #ffd166;
        --duck-beak: #f77f00;
        --text-bright: #ffffff;
        --font-main: 'Fredoka', 'Outfit', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--space-bg); font-family: var(--font-main); color: var(--text-bright); }
      .scene, #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      .flat-stroke { stroke: #080a14; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .duck-body { fill: var(--duck-yellow); }
      .duck-beak { fill: var(--duck-beak); }
      .space-suit { fill: #f8f9fa; }
      .helmet-glass { fill: rgba(78, 205, 196, 0.35); stroke: var(--kurz-teal); stroke-width: 6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene1" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="badge clip" data-start="0" data-duration="5" style="display:flex; align-items:center; gap:16px; padding:14px 36px; border-radius:100px; background:rgba(78,205,196,0.18); border:3px solid var(--kurz-teal); color:var(--kurz-teal); font-size:36px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:30px;">
        <span style="width:18px;height:18px;border-radius:50%;background:var(--kurz-teal);box-shadow:0 0 14px var(--kurz-teal);"></span>
        Did You Know?
      </div>

      <h1 class="headline clip" data-start="0" data-duration="5" style="font-size:110px; font-weight:700; line-height:1.05; letter-spacing:-0.02em; text-align:center; max-width:1400px;">
        Lightning Is <span style="color:#ff6b6b;">Hotter</span> Than <span style="color:#4ecdc4;">The Sun</span>
      </h1>

      <div class="duck-clip clip" data-start="0" data-duration="5" style="position:absolute; bottom:60px; left:100px;">
        <svg width="260" height="260" viewBox="0 0 260 260">
          <path d="M-80,140 Q-90,20 -40,-20 L40,-20 Q90,20 80,140 Z" class="space-suit flat-stroke" />
          <circle cx="-30" cy="40" r="18" fill="#a06cd5" class="flat-stroke" />
          <polygon points="-30,28 -22,46 -38,46" fill="#ffe66d" />
          <circle cx="0" cy="-60" r="85" class="duck-body flat-stroke" />
          <circle cx="25" cy="-80" r="12" fill="#080a14" />
          <circle cx="28" cy="-84" r="4" fill="#ffffff" />
          <path d="M20,-60 C70,-60 85,-40 75,-25 C65,-10 20,-30 20,-60 Z" class="duck-beak flat-stroke" />
          <circle cx="10" cy="-60" r="115" class="helmet-glass" />
          <path d="M-60,-120 A105,105 0 0,1 40,-155 A115,115 0 0,0 -80,-80 Z" fill="rgba(255,255,255,0.4)" />
          <path d="M-85,10 Q-140,20 -130,80 Q-90,90 -75,40 Z" class="space-suit flat-stroke" />
          <path d="M85,10 Q140,20 130,80 Q90,90 75,40 Z" class="space-suit flat-stroke" />
        </svg>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".badge", { opacity: 0, y: -20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 0);
      tl.fromTo(".headline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.3);
      tl.fromTo(".duck-clip", { opacity: 0, x: -100 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.5);
      tl.to(".duck-clip", { y: -10, duration: 2, repeat: 2, yoyo: true, ease: "sine.inOut" }, 0);
      window.__timelines["scene1"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

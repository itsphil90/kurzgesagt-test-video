<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap');

      :root {
        --ground: #0d0905;
        --amber-glow: rgba(245, 166, 35, 0.15);
        --honey-gold: #f5a623;
        --honey-bright: #ffcb46;
        --honey-dark: #b86e00;
        --pyramid-gold: #d4af37;
        --text-bright: #ffffff;
        --text-muted: #d0c2b2;
        --font-main: 'Outfit', sans-serif;
        --font-mono: 'Space Grotesk', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-main);
        color: var(--text-bright);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 65% 50%, #261608 0%, var(--ground) 70%);
      }

      /* Background Ambient Glows */
      .glow-bg {
        position: absolute;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 166, 35, 0.22) 0%, rgba(245, 166, 35, 0) 70%);
        top: 20%;
        right: 15%;
        filter: blur(60px);
        pointer-events: none;
      }

      /* Layout Grid */
      .container {
        position: relative;
        width: 1600px;
        height: 850px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 60px;
        z-index: 2;
      }

      /* Left Side - Text & Counter Content */
      .left-col {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .badge {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 24px;
        border-radius: 100px;
        background: rgba(245, 166, 35, 0.12);
        border: 1px solid rgba(245, 166, 35, 0.3);
        color: var(--honey-bright);
        font-family: var(--font-mono);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }

      .badge-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--honey-bright);
        box-shadow: 0 0 12px var(--honey-bright);
      }

      .main-title {
        font-size: 88px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin-bottom: 24px;
        color: var(--text-bright);
      }

      .main-title span.highlight {
        color: var(--honey-bright);
        background: linear-gradient(135deg, #ffe082 0%, var(--honey-gold) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .stat-card {
        display: flex;
        align-items: baseline;
        gap: 20px;
        margin-top: 16px;
        padding: 24px 36px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(245, 166, 35, 0.25);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        width: fit-content;
      }

      .number-counter {
        font-family: var(--font-mono);
        font-size: 84px;
        font-weight: 700;
        color: var(--honey-bright);
        line-height: 1;
      }

      .stat-label {
        font-size: 28px;
        font-weight: 600;
        color: var(--text-muted);
        max-width: 240px;
        line-height: 1.2;
      }

      .fact-desc {
        font-size: 28px;
        line-height: 1.4;
        color: var(--text-muted);
        margin-top: 28px;
        max-width: 680px;
      }

      /* Right Side - Visual Illustration */
      .right-col {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .illustration-box {
        position: relative;
        width: 650px;
        height: 650px;
      }

      /* SVG Graphics Styling */
      svg.illustration-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .pyramid-line {
        fill: none;
        stroke: var(--pyramid-gold);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.6;
      }

      .honey-jar-glass {
        fill: rgba(255, 255, 255, 0.05);
        stroke: rgba(255, 203, 70, 0.5);
        stroke-width: 4;
      }

      .honey-liquid {
        fill: url(#honeyGradient);
      }

      .honey-drip {
        fill: var(--honey-bright);
        filter: drop-shadow(0 4px 12px rgba(245, 166, 35, 0.6));
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div class="glow-bg clip" data-start="0" data-duration="8" id="glow"></div>

      <div class="container">
        <!-- Left Column: Copy & Counter -->
        <div class="left-col">
          <div class="badge clip" data-start="0" data-duration="8" id="badge">
            <span class="badge-dot"></span>
            Did You Know?
          </div>

          <h1 class="main-title clip" data-start="0" data-duration="8" id="title">
            Honey <span class="highlight">Never</span> Expires.
          </h1>

          <div class="stat-card clip" data-start="1.0" data-duration="7.0" id="stat-card">
            <div class="number-counter" id="counter">0</div>
            <div class="stat-label">Years Old & Still Edible</div>
          </div>

          <p class="fact-desc clip" data-start="2.2" data-duration="5.8" id="desc">
            Archaeologists found edible honey inside ancient Egyptian tombs—perfectly preserved due to its low moisture and high acidity.
          </p>
        </div>

        <!-- Right Column: SVG Illustration -->
        <div class="right-col clip" data-start="0" data-duration="8" id="illustration-col">
          <div class="illustration-box">
            <svg class="illustration-svg" viewBox="0 0 600 600">
              <defs>
                <linearGradient id="honeyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffcb46" />
                  <stop offset="100%" stop-color="#b86e00" />
                </linearGradient>

                <linearGradient id="pyramidFill" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15" />
                  <stop offset="100%" stop-color="#8a6d1c" stop-opacity="0.02" />
                </linearGradient>
              </defs>

              <!-- Egyptian Pyramid Background Lines -->
              <g id="pyramid-group">
                <polygon points="120,480 300,180 480,480" fill="url(#pyramidFill)" class="pyramid-line" />
                <line x1="300" y1="180" x2="300" y2="480" class="pyramid-line" />
                <polygon points="300,180 480,480 540,480" fill="rgba(212, 175, 55, 0.05)" class="pyramid-line" />

                <!-- Sun / Ra Icon behind pyramid -->
                <circle cx="300" cy="180" r="45" fill="none" stroke="#f5a623" stroke-width="2" stroke-dasharray="4 4" id="sun-ring" />
              </g>

              <!-- Honey Jar Illustration -->
              <g id="honey-jar-group" transform="translate(150, 220)">
                <!-- Honey Jar Body Liquid Fill -->
                <path
                  d="M40,110 Q40,90 60,90 L240,90 Q260,90 260,110 L250,220 Q240,260 150,260 Q60,260 50,220 Z"
                  class="honey-liquid"
                  id="jar-liquid"
                />

                <!-- Glass Outline -->
                <path
                  d="M50,60 L250,60 Q270,60 270,90 L260,220 Q250,270 150,270 Q50,270 40,220 L30,90 Q30,60 50,60 Z"
                  class="honey-jar-glass"
                />
                <!-- Jar Rim -->
                <rect x="40" y="45" width="220" height="20" rx="10" fill="none" stroke="#ffcb46" stroke-width="4" />

                <!-- Honeycomb Pattern on Jar -->
                <polygon points="150,140 165,148 165,165 150,173 135,165 135,148" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
                <polygon points="180,140 195,148 195,165 180,173 165,165 165,148" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
                <polygon points="120,140 135,148 135,165 120,173 105,165 105,148" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

                <!-- Honey Dipper Wand -->
                <g id="dipper" transform="translate(150, -40)">
                  <rect x="-6" y="-60" width="12" height="120" rx="6" fill="#8a5314" />
                  <ellipse cx="0" cy="40" rx="24" ry="14" fill="#b86e00" stroke="#ffcb46" stroke-width="2" />
                  <ellipse cx="0" cy="30" rx="28" ry="16" fill="#f5a623" stroke="#ffcb46" stroke-width="2" />
                  <ellipse cx="0" cy="20" rx="24" ry="14" fill="#b86e00" stroke="#ffcb46" stroke-width="2" />
                </g>

                <!-- Dripping Honey Drop -->
                <path
                  id="honey-drop"
                  d="M150,25 C150,25 135,60 135,80 C135,90 142,98 150,98 C158,98 165,90 165,80 C165,60 150,25 150,25 Z"
                  class="honey-drip"
                />
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Frame 0 presentable state (badge & title visible from start)
      tl.fromTo("#badge",
        { opacity: 0.2, y: -10, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power2.out" },
        0
      );

      tl.fromTo("#title",
        { opacity: 0.3, y: 15 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        0
      );

      tl.fromTo("#illustration-col",
        { opacity: 0.3, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // 2. Stat Card Entrance & Counter Animation
      tl.fromTo("#stat-card",
        { opacity: 0, y: 25, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        0.8
      );

      // Count up from 0 to 3,000+
      const counterObj = { val: 0 };
      const counterEl = document.getElementById("counter");
      tl.to(counterObj, {
        val: 3000,
        duration: 1.8,
        ease: "power2.out",
        onUpdate: () => {
          counterEl.textContent = Math.floor(counterObj.val).toLocaleString() + "+";
        }
      }, 1.0);

      // 3. Honey Dipper & Drip Animation
      tl.fromTo("#dipper",
        { y: -60 },
        { y: 0, duration: 1.2, ease: "elastic.out(1, 0.5)" },
        0.5
      );

      tl.fromTo("#honey-drop",
        { scaleY: 0.2, scaleX: 0.8, transformOrigin: "center top" },
        { scaleY: 1.4, scaleX: 1.1, duration: 1.5, ease: "power1.inOut", repeat: 1, yoyo: true },
        1.2
      );

      // 4. Description Text Fade In
      tl.fromTo("#desc",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        2.0
      );

      // Subtle pulse on liquid gradient / glow
      tl.to("#glow", {
        scale: 1.15,
        opacity: 0.8,
        duration: 3,
        repeat: 1,
        yoyo: true,
        ease: "sine.inOut"
      }, 0.8);

      // 5. Outro Fade
      tl.to(["#badge", "#title", "#stat-card", "#desc", "#illustration-col"], {
        opacity: 0,
        y: -20,
        duration: 0.6,
        stagger: 0.08,
        ease: "power2.in"
      }, 7.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

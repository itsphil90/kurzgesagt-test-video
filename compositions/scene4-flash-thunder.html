<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap');
      :root {
        --space-bg: #0b0e1a;
        --kurz-teal: #4ecdc4;
        --kurz-coral: #ff6b6b;
        --lightning: #ffe66d;
        --text-bright: #ffffff;
        --font-main: 'Fredoka', 'Outfit', sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--space-bg); font-family: var(--font-main); color: var(--text-bright); }
      .scene, #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .flat-stroke { stroke: #080a14; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .lightning-bolt { fill: var(--lightning); stroke: #ffb703; stroke-width: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene4" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <!-- Lightning Bolt -->
      <div style="position:absolute; top:120px; left:50%; transform:translateX(-50%);">
        <svg width="200" height="300" viewBox="0 0 200 300">
          <polygon points="100,10 30,130 120,130 60,280 170,80 80,80" class="lightning-bolt flat-stroke" />
        </svg>
      </div>

      <!-- Text -->
      <div style="position:absolute; bottom:200px; left:0; right:0; text-align:center;">
        <h2 class="text1 clip" data-start="0" data-duration="4" style="font-size:72px; font-weight:700; color:#ffe66d;">Flash!</h2>
      </div>

      <div style="position:absolute; bottom:120px; left:0; right:0; text-align:center;">
        <h2 class="text2 clip" data-start="0" data-duration="4" style="font-size:72px; font-weight:700; color:var(--kurz-teal);">Boom!</h2>
      </div>

      <div style="position:absolute; bottom:40px; left:0; right:0; text-align:center;">
        <p class="desc clip" data-start="0" data-duration="4" style="font-size:36px; color:#d0c2b2; max-width:1200px; margin:0 auto;">
          We see the flash before we hear the boom — because light travels much faster than sound.
        </p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".lightning-bolt", { opacity: 0, scale: 0.2, y: -100 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "bounce.out" }, 0);
      tl.fromTo(".text1", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.2);
      tl.fromTo(".text2", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.5);
      tl.fromTo(".desc", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
      tl.to(".lightning-bolt", { scale: 1.05, duration: 0.2, repeat: 2, yoyo: true, ease: "power1.inOut" }, 1.0);
      window.__timelines["scene4"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
